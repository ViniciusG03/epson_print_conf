name: Build Workflow for epson_print_conf.exe/.app

on:
   push:
     tags:
       - "v*.*.*"
   # Manual runs (e.g. on a fork) only build: no VERSION commit, no release,
   # no release cleanup; the builds are attached to the run as artifacts.
   workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.ref }}
          fetch-depth: 0  # Fetch all history for accurate commits and tags

      - name: Update VERSION in python file ui.py; commit and push updates
        if: github.event_name == 'push'
        run: |
          $filePath = "ui.py"
          $VERSION = "${{ github.ref_name }}"
          if ($VERSION.StartsWith('v')) {
              $VERSION = $VERSION.Substring(1)
          }
          (Get-Content $filePath) -replace '^VERSION = ".*"$', "VERSION = `"$VERSION`"" | Set-Content $filePath
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add $filePath
          git commit -m "Update VERSION to ${{ github.ref_name }}"
          git remote set-url origin https://${GITHUB_USER}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin main

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          #pip install git+https://github.com/pyinstaller/pyinstaller@develop
          pip install pyinstaller
          pip install Pillow
          pip install -r requirements.txt

      - name: Run PyInstaller to create epson_print_conf.exe
        run: python -m PyInstaller epson_print_conf.spec -- --default

      - name: Zip the epson_print_conf.exe asset to epson_print_conf.zip
        run: |
          Compress-Archive dist/epson_print_conf.exe dist/epson_print_conf.zip
        shell: pwsh

      - name: Upload Windows build as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: epson_print_conf-windows
          path: dist/epson_print_conf.zip

      - name: Generate Changelog
        if: github.event_name == 'push'
        run: >
          echo "The *epson_print_conf.exe* executable file in the
          *epson_print_conf.zip* archive within the assets below is
          auto-generated by a [GitHub Action](.github/workflows/build.yml).
          The *epson_print_conf-macos-arm64.zip* archive contains the
          macOS app for Apple Silicon (not notarized: see the README
          for how to open it the first time).
          <br /><br />
          Check the
          [History of modifications](https://github.com/Ircama/epson_print_conf/commits/main/).
          "
          > ${{ github.workspace }}-CHANGELOG.txt

      - name: Create Release, uploading the epson_print_conf.zip asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          files: dist/epson_print_conf.zip
          append_body: true
          generate_release_notes: false

  build-macos:
    # After Windows: on a tag, that job commits the VERSION bump to main and
    # creates the release this job appends to.
    needs: build-windows
    runs-on: macos-14  # Apple Silicon (arm64)
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install libusb (bundled into the app)
        run: brew install libusb

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Run PyInstaller to create epson_print_conf.app
        run: >
          python -m PyInstaller --noconfirm epson_print_conf.spec --
          --default
          --version "${{ github.event_name == 'push' && github.ref_name || '' }}"

      - name: Smoke test the app bundle
        run: |
          ls dist/epson_print_conf.app/Contents/Frameworks/libusb-1.0*.dylib
          codesign --verify --deep --strict --verbose=2 dist/epson_print_conf.app
          dist/epson_print_conf.app/Contents/MacOS/epson_print_conf &
          APP_PID=$!
          sleep 15
          kill -0 "$APP_PID"  # still running: it started without crashing
          kill "$APP_PID"

      - name: Zip the app (ditto keeps the bundle's symlinks)
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          dist/epson_print_conf.app dist/epson_print_conf-macos-arm64.zip

      - name: Upload macOS build as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: epson_print_conf-macos-arm64
          path: dist/epson_print_conf-macos-arm64.zip

      - name: Attach the app to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/epson_print_conf-macos-arm64.zip
          append_body: true

  cleanup:
    # always(): a macOS failure must not stop the existing old-release cleanup
    # that used to run at the end of the Windows job.
    if: always() && needs.build-windows.result == 'success' && startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Remove old releases
        uses: Nats-ji/delete-old-releases@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-count: 1
          keep-old-minor-releases: false
          keep-old-minor-releases-count: 1
          remove-tags: true
